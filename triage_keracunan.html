html,
body{

.counter{

}

.progress{

/* =========================================================
   STAGE
========================================================= */

.stage{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;

    padding-top:64px;

    overflow:hidden;
}

.slide{
    position:absolute;

    inset:64px 0 0 0;

    padding:

    display:none;

    overflow-y:auto;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(32,107,144,.09),
            transparent 32%
        );
}

.slide.active{
    display:block;
    animation:
        slideIn .25s ease;
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(14px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.slide::-webkit-scrollbar{
    width:7px;
}

.slide::-webkit-scrollbar-thumb{

/* =========================================================
   RENDER
========================================================= */

const stage = document.getElementById("stage");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const menuGrid = document.getElementById("menuGrid");

let current = 0;

function render(){

    stage.innerHTML = "";

    slides.forEach((slide,index)=>{

        const section = document.createElement("section");

        section.className =
            "slide" +
            (index === 0 ? " active" : "");

        section.dataset.index = index;

        section.innerHTML =
            slide.html +
            `
            <div class="footer">
                <span>
                    TRIAGE IGD 2026 • KASUS KERACUNAN • SiLARAS 119 RSSA • EDUCATION MODE
                </span>

                <span class="slide-no">
                    ${String(index+1).padStart(2,"0")} / 52
                </span>
            </div>
            `;

        stage.appendChild(section);

    });

    buildMenu();

    update();

}

function buildMenu(){

    menuGrid.innerHTML = "";

    slides.forEach((slide,index)=>{

        const item =
            document.createElement("button");

        item.className = "menu-item";

        item.innerHTML = `
            <div class="menu-number">
                SLIDE ${String(index+1).padStart(2,"0")}
            </div>

            <div>
                ${slide.title}
            </div>
        `;

        item.onclick = ()=>{

            go(index);

            toggleMenu();

        };

        menuGrid.appendChild(item);

    });

}

/* =========================================================
   NAVIGATION
========================================================= */

function go(index){

    if(index < 0){
        index = 0;
    }

    if(index >= slides.length){
        index = slides.length - 1;
    }

    const old =
        document.querySelector(".slide.active");

    if(old){
        old.classList.remove("active");
    }

    const target =
        document.querySelector(
            `.slide[data-index="${index}"]`
        );

    if(target){
        target.classList.add("active");
        target.scrollTop = 0;
    }

    current = index;

    update();

}

function next(){

    if(current < slides.length - 1){
        go(current + 1);
    }

}

function prev(){

    if(current > 0){
        go(current - 1);
    }

}

function update(){

    counter.textContent =
        `${String(current+1).padStart(2,"0")} / 52`;

    progress.style.width =
        `${((current+1)/slides.length)*100}%`;

}

/* =========================================================
   MENU
========================================================= */

function toggleMenu(){

    document
        .getElementById("menu")
        .classList.toggle("open");

}

/* =========================================================
   FULLSCREEN
========================================================= */

function toggleFullscreen(){

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen?.();

    }else{

        document.exitFullscreen?.();

    }

}

/* =========================================================
   CASE REVEAL
========================================================= */

function reveal(button){

    const solution =
        button.nextElementSibling;

    if(!solution){
        return;
    }

    solution.classList.toggle("show");

    button.textContent =
        solution.classList.contains("show")
        ? "Sembunyikan pembahasan"
        : "Tampilkan pembahasan";

}

/* =========================================================
   KEYBOARD CONTROL
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA"
        ){
            return;
        }

        switch(e.key){

            case "ArrowRight":
            case "ArrowDown":
            case " ":
            case "PageDown":
                e.preventDefault();
                next();
                break;

            case "ArrowLeft":
            case "ArrowUp":
            case "PageUp":
                e.preventDefault();
                prev();
                break;

            case "Home":
                e.preventDefault();
                go(0);
                break;

            case "End":
                e.preventDefault();
                go(slides.length-1);
                break;

            case "f":
            case "F":
                toggleFullscreen();
                break;

            case "m":
            case "M":
                toggleMenu();
                break;

            case "Escape":
                document
                    .getElementById("menu")
                    .classList.remove("open");
                break;

        }

    }
);

/* =========================================================
   MOUSE / TOUCH
========================================================= */

let touchStartX = 0;

stage.addEventListener(
    "touchstart",
    e=>{

        touchStartX =
            e.changedTouches[0].screenX;

    },
    {passive:true}
);

stage.addEventListener(
    "touchend",
    e=>{

        const endX =
            e.changedTouches[0].screenX;

        const diff =
            endX - touchStartX;

        if(Math.abs(diff) < 50){
            return;
        }

        if(diff < 0){
            next();
        }else{
            prev();
        }

    },
    {passive:true}
);

/* =========================================================
   CLICK SLIDE TO ADVANCE
========================================================= */

stage.addEventListener(
    "click",
    e=>{

        if(
            e.target.closest("button") ||
            e.target.closest("a") ||
            e.target.closest(".option")
        ){
            return;
        }

        const width =
            window.innerWidth;

        if(e.clientX > width * .72){
            next();
        }else if(e.clientX < width * .28){
            prev();
        }

    }
);

/* =========================================================
   START
========================================================= */

render();

/* =========================================================
   FINAL PRINT — ALL 52 SLIDES
========================================================= */

function printAllSlides() {

    console.log("PRINT ALL SLIDES");

    /*
     * Beri browser waktu menerapkan @media print
     */
    requestAnimationFrame(function () {

        setTimeout(function () {

            window.print();

    });
}


/* =========================================================
   PRINT BUTTON
   Lebih aman daripada inline onclick
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    const btnPrint = document.getElementById("btnPrint");

    if (btnPrint) {

        btnPrint.addEventListener("click", function () {

            printAllSlides();

    }

});

========================================================= */

function addEducatorHeader() {

    document.querySelectorAll(".slide").forEach(function (slide) {

        if (slide.querySelector(".educator-header")) {
            return;
        }

        const educator = document.createElement("div");

        educator.className = "educator-header";

        educator.innerHTML =
            '📷 Instagram <strong>@mryungmalang</strong>';

        slide.appendChild(educator);

    });

}


document.addEventListener("DOMContentLoaded", function () {

    addEducatorHeader();

});

const educatorObserver = new MutationObserver(function () {

    addEducatorHeader();

});

educatorObserver.observe(document.body, {
    childList: true,
    subtree: true
});

</script>
